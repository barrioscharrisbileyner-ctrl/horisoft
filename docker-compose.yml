services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_NAME:-horisoft_db}
      MYSQL_USER: ${DOCKER_DB_USER:?Set DOCKER_DB_USER in .env}
      MYSQL_PASSWORD: ${DOCKER_DB_PASSWORD:?Set DOCKER_DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DOCKER_DB_ROOT_PASSWORD:?Set DOCKER_DB_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    environment:
      DJANGO_ENV: production
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_NAME: ${MYSQL_NAME:-horisoft_db}
      MYSQL_USER: ${DOCKER_DB_USER:?Set DOCKER_DB_USER in .env}
      MYSQL_PASSWORD: ${DOCKER_DB_PASSWORD:?Set DOCKER_DB_PASSWORD in .env}
      REDIS_URL: redis://redis:6379/1
    env_file:
      - .env
    volumes:
      - private_media:/app/private_media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/api/v1/health/', headers={'X-Forwarded-Proto': 'https'}), timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  migrate:
    build: .
    profiles: ["maintenance"]
    environment:
      DJANGO_ENV: production
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_NAME: ${MYSQL_NAME:-horisoft_db}
      MYSQL_USER: ${DOCKER_DB_USER:?Set DOCKER_DB_USER in .env}
      MYSQL_PASSWORD: ${DOCKER_DB_PASSWORD:?Set DOCKER_DB_PASSWORD in .env}
    env_file:
      - .env
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
  private_media:
