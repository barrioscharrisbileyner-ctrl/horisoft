{% extends "residentes/base.html" %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block contenido %}
<h1 class="h3 mb-4">{{ titulo }}</h1>
<form method="post" class="col-lg-8">
  {% csrf_token %}
  {{ form.as_p }}
  <button class="btn btn-success" type="submit">Guardar</button>
  <a class="btn btn-outline-secondary" href="{% url 'financiera:cuentas' %}">Cancelar</a>
</form>
{% endblock %}
