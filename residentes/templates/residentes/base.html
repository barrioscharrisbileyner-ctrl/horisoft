<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Horisoft{% endblock %} — Horisoft</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root { --horisoft-azul: #1e293b; --horisoft-azul-claro: #3b82f6; }
    body { background-color: #f8fafc; }
    .navbar-horisoft { background-color: var(--horisoft-azul); }
    .navbar-horisoft .nav-link { color: #cbd5e1; }
    .navbar-horisoft .nav-link.active, .navbar-horisoft .nav-link:hover { color: #fff; }
    .navbar-horisoft .navbar-brand { color: #fff; font-weight: 700; }
    .navbar-horisoft .navbar-brand i { color: var(--horisoft-azul-claro); margin-right: 6px; }
    .btn-success { background-color: var(--horisoft-azul-claro); border-color: var(--horisoft-azul-claro); }
    .btn-success:hover { background-color: #2563eb; border-color: #2563eb; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-horisoft mb-4">
    <div class="container">
      <a class="navbar-brand" href="{% url 'residentes:inicio' %}">
        <i class="fa-solid fa-building-shield"></i>Horisoft <small class="fw-normal">administración de PH</small>
      </a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link {% if seccion == 'personas' %}active{% endif %}" href="{% url 'residentes:personas' %}">Residentes</a></li>
          <li class="nav-item"><a class="nav-link {% if seccion == 'unidades' %}active{% endif %}" href="{% url 'residentes:unidades' %}">Unidades</a></li>
          <li class="nav-item"><a class="nav-link {% if seccion == 'residencias' %}active{% endif %}" href="{% url 'residentes:residencias' %}">Residencias</a></li>
        </ul>
      </div>
    </div>
  </nav>
  <div class="container pb-5">
    {% block contenido %}{% endblock %}
  </div>
</body>
</html>
