{% if pagina and pagina.paginator.num_pages > 1 %}
<nav aria-label="Paginación">
  <ul class="pagination">
    {% if pagina.has_previous %}<li class="page-item"><a class="page-link" href="?page={{ pagina.previous_page_number }}">Anterior</a></li>{% endif %}
    <li class="page-item disabled"><span class="page-link">Página {{ pagina.number }} de {{ pagina.paginator.num_pages }}</span></li>
    {% if pagina.has_next %}<li class="page-item"><a class="page-link" href="?page={{ pagina.next_page_number }}">Siguiente</a></li>{% endif %}
  </ul>
</nav>
{% endif %}
