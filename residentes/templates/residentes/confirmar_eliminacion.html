{% extends "residentes/base.html" %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block contenido %}
<div class="card">
  <div class="card-body">
    <h1 class="h4">{{ titulo }}</h1>
    <p>¿Confirmas que deseas eliminar «{{ objeto }}»?</p>
    <form method="post">
      {% csrf_token %}
      <button class="btn btn-danger" type="submit">Confirmar eliminación</button>
      <a class="btn btn-outline-secondary" href="{% url cancel_url %}">Cancelar</a>
    </form>
  </div>
</div>
{% endblock %}
