plugins {
    id 'com.android.application'
}

android {
    namespace 'com.horisoft.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.horisoft.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // AppCompatActivity + Theme.AppCompat.* (usados en LoginActivity, HomeActivity y styles.xml)
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // org.json (JSONObject) ya viene incluido en el SDK de Android — no requiere dependencia aparte.
}
